<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Владимир, фотограф</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf8f4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23faf8f4'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23181513' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #faf8f4;
      --ink: #17130f;
      --ink-soft: #6e665c;
      --line: #e3dcd1;
      --accent: #8a6a4c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 560px; }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      color: var(--ink-soft);
      font-size: clamp(9.5px, 2.5vw, 10.5px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .label::before {
      content: "";
      width: 26px;
      height: 1px;
      background: currentColor;
      opacity: 0.55;
    }

    .code {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(72px, 18vw, 132px);
      font-weight: 300;
      line-height: 0.86;
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    h1 {
      margin: 18px 0 16px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 300;
      line-height: 1.15;
    }

    p {
      margin: 0 0 28px;
      max-width: 40ch;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.8;
    }

    .links { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }

    a {
      color: var(--ink);
      font-size: 13px;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 3px;
      transition: border-color 0.3s ease, color 0.3s ease;
    }

    a:hover { border-color: var(--ink); color: var(--accent); }

    .home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 11.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .home:hover { background: var(--accent); color: var(--paper); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="label">Владимир · фотограф · Москва</p>
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>
      Возможно, ссылка устарела или в адресе опечатка.
      Все работы, цены и контакты — на главной.
    </p>
    <div class="links">
      <!-- адрес сайта на GitHub Pages -->
      <a class="home" href="https://vladimir124213-cloud.github.io/vladimirf1.8.github.io/">На главную</a>
      <a href="https://t.me/vladimirvolkovs">Telegram</a>
      <a href="mailto:hello@yourname.ru">Почта</a>
    </div>
  </main>
</body>
</html>
